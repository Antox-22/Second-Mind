<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <img src="../../assets/icons/icon-trs.png" alt="Icon" class="icon">
        <span class="title">
            <lang data-key="title">title</lang>
        </span>
    </header>

    <div class="version-section">
        <div class="version-wrapper">
            <div class="v-box">
                <span class="v-label"><lang data-key="oldVersion"></lang></span>
                <span class="v-num" id="oldVersionNumber">0.8.2</span>
            </div>

            <div class="v-arrow">➔</div>

            <div class="v-box loading" id="newVersionBox">
                <span class="v-label"><lang data-key="newVersion"></lang></span>
                <span class="v-num" id="newVersionNumber">1.0.0</span>
                <div class="skeleton-line"></div>
            </div>
        </div>
    </div>

    <div class="section">

        <div class="card" id="pkg">
            <span class="title"><lang data-key="pkg_title">title</lang></span>
        </div>

        <div class="card" id="conf">
            <span class="title"><lang data-key="conf_title">conf_title</lang></span>
            <div class="input-field">

                <div class="input-row">
                    <div class="input-group name-group">
                        <label for="name" id="name-label"><lang data-key="name">name</lang></label>
                        <input type="text" id="name" placeholder="Es. Paolo">
                    </div>

                    <div class="input-group age-group">
                        <label for="age" id="age-label"><lang data-key="age">age</lang></label>
                        <input type="number"
                            id="age"
                            min="0"
                            max="99"
                            oninput="if(this.value > 99) this.value = 99; if(this.value < 0) this.value = 0;" 
                            placeholder="22">
                    </div>
                </div>

                <div class="input-group">
                    <label for="language" id="language-label"><lang data-key="language">language</lang></label>
                    <select id="language">
                    </select>
                    <div class="btn-submit">

                        <button id="submit"><lang data-key="submit">submit</lang></button>
                    </div>
                </div>

            </div>
        </div>

        <div class="card" id="spacy">
            <span class="title"><lang data-key="spacy_title">title</lang></span>
            <div class="subtitle">
                <span id="span-subtitle"><lang data-key="install_spacy">...</lang></span>
                <span id="submodel">modello</span>
            </div>
            <div class="container">
                <div class="loader">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path fill-rule="evenodd" clip-rule="evenodd" d="M8 10C8 7.79086 9.79086 6 12 6C14.2091 6 16 7.79086 16 10V11H17C18.933 11 20.5 12.567 20.5 14.5C20.5 16.433 18.933 18 17 18H16.9C16.3477 18 15.9 18.4477 15.9 19C15.9 19.5523 16.3477 20 16.9 20H17C20.0376 20 22.5 17.5376 22.5 14.5C22.5 11.7793 20.5245 9.51997 17.9296 9.07824C17.4862 6.20213 15.0003 4 12 4C8.99974 4 6.51381 6.20213 6.07036 9.07824C3.47551 9.51997 1.5 11.7793 1.5 14.5C1.5 17.5376 3.96243 20 7 20H7.1C7.65228 20 8.1 19.5523 8.1 19C8.1 18.4477 7.65228 18 7.1 18H7C5.067 18 3.5 16.433 3.5 14.5C3.5 12.567 5.067 11 7 11H8V10ZM13 11C13 10.4477 12.5523 10 12 10C11.4477 10 11 10.4477 11 11V16.5858L9.70711 15.2929C9.31658 14.9024 8.68342 14.9024 8.29289 15.2929C7.90237 15.6834 7.90237 16.3166 8.29289 16.7071L11.2929 19.7071C11.6834 20.0976 12.3166 20.0976 12.7071 19.7071L15.7071 16.7071C16.0976 16.3166 16.0976 15.6834 15.7071 15.2929C15.3166 14.9024 14.6834 14.9024 14.2929 15.2929L13 16.5858V11Z" fill="#0f0f0f" data-darkreader-inline-fill="" style="--darkreader-inline-fill: var(--darkreader-background-000000, #000000);"></path> </g></svg>
            </div>
        </div>

    </div>

    <footer class="footer">
        <span class="log"><lang data-key="stage_log_0">dependens_stage_0</lang></span>
        <div class="progress-bar">
            <div class="progress"></div>
        </div>
    </footer>


    <script type="module" src="script.js"></script>
</body>
</html>
